# Install once with `pre-commit install`; requires gitleaks, OpenTofu, and terraform-docs on PATH.
# It installs both hook types below; re-run it after pulling a change to them.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -check -recursive
        language: system
        pass_filenames: false
        files: \.(tf|tftest\.hcl)$
      - id: terraform-docs-modules
        name: terraform-docs (modules)
        entry: terraform-docs --config .terraform-docs.yml --recursive --recursive-path modules --recursive-include-main=false .
        language: system
        pass_filenames: false
        files: ^modules/.*\.(tf|md)$
      - id: terraform-docs-live
        name: terraform-docs (live)
        entry: terraform-docs --config .terraform-docs.yml --recursive --recursive-path live --recursive-include-main=false .
        language: system
        pass_filenames: false
        files: ^live/.*\.(tf|md)$
      # Commits are attributed to people, not agents (Identity ADR-0128). The project template's commit-msg hook strips
      # agent attribution; `sh` runs it because pre-commit on Windows can't run a `#!/bin/sh` script. Don't set
      # core.hooksPath, as the template's scripts suggest: pre-commit refuses to install while it is set.
      - id: strip-agent-attribution
        name: strip agent attribution
        entry: sh .githooks/commit-msg
        language: system
        stages: [commit-msg]
