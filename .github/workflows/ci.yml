name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A required check must also report in a merge queue.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request or a topic branch cancels the run it supersedes. A run for a default-branch commit or a
# merge queue entry is never cancelled: its group holds its commit SHA, because cancel-in-progress: false alone still
# lets a newer run in the same group cancel a pending one, which would leave that commit without a verdict.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'merge_group') && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'merge_group' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the decision index
        run: ./.template/Test-AdrIndex.ps1
      - name: Test
        run: |
          pwsh -NoProfile -File ./build/tests/agent-customizations.tests.ps1

  commit-attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit attribution
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: ./.template/Test-CommitAttribution.ps1 -Base $env:BASE -Head $env:HEAD
