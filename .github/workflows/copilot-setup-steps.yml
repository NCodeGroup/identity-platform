# The Copilot cloud agent's environment, prepared before each session: GitHub runs this workflow's one job on the
# session's fresh runner, so the agent starts with the project's toolchain and packages instead of installing them
# itself. GitHub reads the job only from the default branch and only under the name copilot-setup-steps, and takes only
# its steps, permissions, runs-on, services, snapshot and timeout-minutes, so each step names its own shell. When a step
# fails, the rest are skipped and the session starts anyway. The push and pull_request triggers run it when this file
# changes, to show it still works.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # The session's limit too, counted from this job's start: 59 is the most Copilot allows.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      # The agent gets a token of its own, so the checkout keeps none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools AGENTS.md's local checks run, installed as validate.yml installs them; keep the pins in step with it.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Install terraform-docs
        shell: bash
        env:
          TERRAFORM_DOCS_VERSION: v0.24.0
        run: |
          dir="$RUNNER_TEMP/terraform-docs"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}"
          archive="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/terraform-docs-${TERRAFORM_DOCS_VERSION}.sha256sum"
          grep " ${archive}\$" "terraform-docs-${TERRAFORM_DOCS_VERSION}.sha256sum" | sha256sum --check --strict
          tar -xzf "$archive" terraform-docs
          echo "$dir" >> "$GITHUB_PATH"
