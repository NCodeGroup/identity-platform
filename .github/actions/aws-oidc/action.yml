name: AWS credentials from GitHub OIDC
description: >-
  Exchanges the job's OIDC token for a one-hour session on an IAM role. The session is named after the workflow run
  (gh-<run_id>-<run_attempt>), so CloudTrail attributes every call to it (ADR-0136).

inputs:
  role-arn:
    description: IAM role to assume.
    required: true
  region:
    description: AWS region for the session and later AWS calls.
    required: true

runs:
  using: composite
  steps:
    - name: Assume the role
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
        REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        token=$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
        echo "::add-mask::${token}"
        creds=$(aws sts assume-role-with-web-identity \
          --role-arn "${ROLE_ARN}" \
          --role-session-name "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          --web-identity-token "${token}" \
          --duration-seconds 3600 \
          --region "${REGION}" \
          --query Credentials --output json)
        for field in AccessKeyId SecretAccessKey SessionToken; do
          echo "::add-mask::$(jq -r ".${field}" <<<"${creds}")"
        done
        {
          echo "AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"${creds}")"
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"${creds}")"
          echo "AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"${creds}")"
          echo "AWS_REGION=${REGION}"
        } >> "${GITHUB_ENV}"
